name: DMFlow prototype verification

on:
  push:
    branches:
      - dmflow-scout-prototype-2026-10-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dmflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dmflow/package-lock.json
      - run: npm ci
      - run: npm run test:portal
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker

  package-windows:
    name: Package Windows NSIS
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dmflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dmflow/package-lock.json
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: dmflow-windows-unsigned
          path: dmflow/artifacts/**/*
          if-no-files-found: error
