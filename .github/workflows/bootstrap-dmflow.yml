name: Bootstrap DMFlow source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-dmflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/dmflow-source.b64 > /tmp/dmflow-source.zip
          echo "982230ba301c9966f152ee698d33b25f00303a32c969c56580003b424c3123ad  /tmp/dmflow-source.zip" | sha256sum --check -
          unzip -q -o /tmp/dmflow-source.zip -d .
          test "$(find dmflow -type f | wc -l | tr -d ' ')" = "54"

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dmflow
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import DMFlow 0.1.0 source"
          git push origin HEAD:main
