name: DMFlow prototype verification

# Release-candidate packaged acceptance is triggered with [package] in the commit message.

on:
  push:
    branches:
      - dmflow-scout-prototype-2026-10-01
    paths-ignore:
      - 'dmflow/docs/**'
      - 'dmflow/*.md'
  workflow_dispatch:

concurrency:
  group: dmflow-prototype-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dmflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: dmflow/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:portal

  worker-integration:
    name: Worker integration (Miniflare/D1/Queues)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dmflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: dmflow/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:worker

  windows-package:
    name: Windows NSIS package
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dmflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: dmflow/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run package:win
      - name: Test packaged Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path artifacts -Recurse -Filter "DMFlow.exe" | Select-Object -First 1
          if (-not $exe) { throw "Packaged DMFlow.exe not found." }
          $env:DMFLOW_TEST_EXECUTABLE = $exe.FullName
          npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dmflow-windows-unsigned
          path: dmflow/artifacts/**/*
          if-no-files-found: error
          retention-days: 7

  mac-package:
    name: macOS ARM64 package
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    runs-on: macos-15
    defaults:
      run:
        working-directory: dmflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: dmflow/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - name: Test packaged macOS executable
        run: DMFLOW_TEST_EXECUTABLE="$PWD/artifacts/mac-arm64/DMFlow.app/Contents/MacOS/DMFlow" npm run test:desktop
